name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The integration receipt check reads both source histories (#19).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check the integration receipt (#19)
        # Checks the tree of the commit that last wrote the receipt, so the check
        # stays meaningful after later changes land on main.
        run: |
          rev="$(git log -1 --format=%H -- docs/plans/bafu-community/integration-receipt.json)"
          uv run --no-project python scripts/check_integration_receipt.py --rev "$rev"
      - name: Check contribution records
        run: |
          uv run --no-project python scripts/community.py check
          uv run --no-project python -m unittest discover -s community/tests
          uv run --no-project python scripts/build_checks.py community/templates/build-audit.json
      - name: Build public documentation
        run: uv run --no-project --with markdown==3.7 python scripts/build_site.py
      - name: Check links, assets and published file types
        run: uv run --no-project python scripts/check_site.py _site
      - name: Upload the documentation site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
