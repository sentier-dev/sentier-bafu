[project]
name = "bafu-community-fixes"
version = "0.1.0"
description = "Community patches for the BAFU LCA database (EcoSpold 1 in, EcoSpold 1 out), and what the build needs to write the result into Brightway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Mutel", email = "cmutel@gmail.com" },
    { name = "Laurenz Bougan", email = "laurenz@d-d-s.ch" },
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "platformdirs>=4.13.0",
    "pydantic>=2.14.1",
    "textual>=8.2.8",
]

[project.optional-dependencies]
# What `bafu_brightway` (the command `bafu-brightway`) needs on top of the patch tool: the
# Brightway installer, sentier-brightway, pinned by commit, and what its writer needs. The
# patch tool runs without it; the build of a Brightway database (`scripts/build_release.py`)
# and the tests in `installer-tests/` need it.
brightway = [
    "sentier-brightway @ git+https://github.com/sentier-dev/sentier-brightway@54861b306b631a02774576b52643471bfe2ed8c0",
    "bw2calc>=2.0",
    "bw2data>=4.0",
    "bw_processing>=1.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=14",
    # What changed between the builds, before and after, in the format every Sentier dataset
    # repository writes (sentier-dev/sentier-diagnostics). Standard library only. Pinned to the
    # commit of main where its first version was merged, until it is tagged; then to that tag.
    "sentier-diagnostics @ git+https://github.com/sentier-dev/sentier-diagnostics@117a586db3aa0bc30fbf87502b656bead5b7edc4",
]

[project.scripts]
bafu-fixes = "bafu_community_fixes.cli:main"
bafu-fixes-tui = "bafu_community_fixes.tui:main"
bafu-brightway = "bafu_brightway.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two packages in one distribution: the patch tool, and what this repository adds to the
# Brightway installer (the countries' factors, the second linking, its own data pins).
module-name = ["bafu_community_fixes", "bafu_brightway"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
# `uv run pytest` runs the patch tool's tests. The installer's tests need the `brightway`
# extra and are run by name: `uv run --extra brightway pytest installer-tests`.
testpaths = ["tests"]
markers = ["bw: needs bw2data and bw2calc (the `brightway` extra)"]

[tool.ruff]
line-length = 100
# Review-workspace files merged from sentier-bafu (#19) keep their own style for now;
# the community lint scope stays exactly what it was. Bringing them under ruff is a
# separate, visible change.
extend-exclude = [
    # Scripts of a recorded run keep the bytes their README pins by sha256.
    "community/runs/",
    "community/tests/",
    "registry-tests/",
    "scripts/audit_flow_mapping.py",
    "scripts/audit_registry.py",
    "scripts/build_checks.py",
    "scripts/build_site.py",
    "scripts/check_site.py",
    "scripts/community.py",
    # The records, the site and the automation, written after the merge above in the
    # same style as the files before them.
    "scripts/github_api.py",
    "scripts/intake.py",
    "scripts/patches_snapshot.py",
    "scripts/shared_files.py",
    "scripts/sitebuild/",
    "scripts/sync.py",
    "scripts/triage.py",
]

[tool.ruff.per-file-target-version]
# The build, the export, the site and the records start on Python 3.12 (`uv run --python
# 3.12`, or the runner's own Python); the package is 3.14, and ruff takes its target from
# `requires-python`. For 3.14 the formatter writes `except A, B:` without parentheses,
# which 3.12 cannot read. With the target said here it keeps them, and `ruff check`
# reports the form without them as a syntax error.
"scripts/**" = "py312"
"release-build-tests/**" = "py312"
"export-tests/**" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
